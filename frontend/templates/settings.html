<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | OTP.CORE</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 0.8rem 1rem;
            border-radius: 10px;
            color: white;
            outline: none;
            transition: border-color 0.3s ease;
            resize: vertical;
            min-height: 100px;
        }
        textarea:focus {
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <a href="/">OTP.CORE</a>
        </div>
        <div class="nav-links">
            <a href="/login">Login</a>
            <a href="/register" class="signup">Get Started</a>
        </div>
    </nav>

    <div style="display: flex; gap: 4rem; max-width: 1400px; margin: 0 auto; padding: 120px 2rem 40px;">
        <!-- Sidebar -->
        <aside class="sidebar glass" style="width: 80px; display: flex; flex-direction: column; align-items: center; padding: 2rem 0; gap: 2rem; border-radius: 16px; height: fit-content; flex-shrink: 0; position: sticky; top: 120px;">
            <!-- Home Icon -->
            <a href="/dashboard" class="icon-link" title="Dashboard" style="color: var(--text-muted); transition: color 0.3s; display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--glass-bg);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </a>
            <!-- Settings Icon -->
            <a href="/settings" class="icon-link" title="Settings" style="color: var(--primary); transition: color 0.3s; display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--glass-bg);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </a>
            <!-- Logout Icon -->
            <a href="/logout" onclick="return confirm('Are you sure you want to log out?');" class="icon-link" title="Logout"
                style="color: #ef4444; transition: color 0.3s; display: flex; justify-content: center; align-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--glass-bg);">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </a>
        </aside>

        <!-- Main Content -->
        <div class="dash-container" style="flex: 1; padding: 0; max-width: 800px; margin: 0 auto;">
            <header class="dash-header" style="text-align: center;">
                <h1>Organization Settings</h1>
                <p>Configure your organization details and email templates.</p>
            </header>

            <div class="card glass" style="margin: 0 auto;">
                <form method="post" action="/settings">
                    <div class="input-group">
                        <label>Organization Name</label>
                        <input type="text" name="org_name" value="{{ settings.org_name if settings else '' }}" placeholder="Your Company">
                    </div>
                    
                    <div class="input-group">
                        <label>Email Subject</label>
                        <input type="text" name="email_subject" value="{{ settings.email_subject if settings else '' }}" placeholder="Your OTP Code">
                    </div>
                    
                    <div class="input-group">
                        <label>Support Email</label>
                        <input type="email" name="support_email" value="{{ settings.support_email if settings else '' }}" placeholder="support@example.com">
                    </div>
                    
                    <div class="input-group">
                        <label>Footer Text</label>
                        <textarea name="footer_text" placeholder="Thank you for using our service.">{{ settings.footer_text if settings else '' }}</textarea>
                    </div>
                    
                    <button type="submit" class="btn primary" style="width: 100%; margin-top: 1rem;">Save Changes</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
